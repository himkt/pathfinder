name: cpu.release

on:
  release:
    types:
      - published

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-26
            bottle_tag: arm64_sonoma
          - target: x86_64-apple-darwin
            runner: macos-26
            bottle_tag: sonoma
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            bottle_tag: x86_64_linux
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            bottle_tag: arm64_linux
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Resolve the release version
        id: version
        env:
          tag_name: ${{ github.event.release.tag_name }}
        run: echo "version=${tag_name#v}" >> "$GITHUB_OUTPUT"
      - name: Build the release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package and upload the release archive
        env:
          GH_TOKEN: ${{ github.token }}
          tag_name: ${{ github.event.release.tag_name }}
          version: ${{ steps.version.outputs.version }}
        run: |
          tar -czf "pathfinder-v${version}-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" pathfinder
          gh release upload "$tag_name" "pathfinder-v${version}-${{ matrix.target }}.tar.gz" --clobber
      - name: Package and upload the bottle
        env:
          GH_TOKEN: ${{ github.token }}
          tag_name: ${{ github.event.release.tag_name }}
          version: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "keg/pathfinder/${version}/bin"
          cp "target/${{ matrix.target }}/release/pathfinder" "keg/pathfinder/${version}/bin/pathfinder"
          tar -czf "pathfinder-${version}.${{ matrix.bottle_tag }}.bottle.tar.gz" -C keg pathfinder
          gh release upload "$tag_name" "pathfinder-${version}.${{ matrix.bottle_tag }}.bottle.tar.gz" --clobber
